<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mi Motor - Núcleo</title>
<style>
  /* El motor se adapta al tamaño de su contenedor, para poder ser embebido */
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #1a1a1a;
    overflow: hidden;
  }
  #motor-contenedor {
    width: 100%;
    height: 100vh; /* Cuando se embeba, el contenedor externo definirá el tamaño real */
  }
  /* Panel temporal para mostrar errores en pantalla (para depurar desde el celular) */
  #panel-errores {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    max-height: 60vh;
    overflow-y: auto;
    background: #300;
    color: #ffb3b3;
    font-family: monospace;
    font-size: 12px;
    padding: 8px;
    z-index: 9999;
    white-space: pre-wrap;
    display: none; /* se muestra solo si hay al menos un error */
  }
</style>
</head>
<body>

  <!-- Panel de errores: normalmente invisible, aparece solo si algo falla -->
  <div id="panel-errores"></div>

  <!-- Este div es donde vive el motor. Al embeber, solo hace falta este contenedor -->
  <div id="motor-contenedor"></div>

  <script>
    // Capturamos cualquier error de JavaScript y lo mostramos en pantalla,
    // ya que en el celular no es fácil abrir la consola del navegador.
    window.addEventListener('error', function (evento) {
      const panel = document.getElementById('panel-errores');
      panel.style.display = 'block';
      const detalle = evento.filename
        ? `${evento.message}\n  en ${evento.filename}:${evento.lineno}`
        : evento.message;
      panel.textContent += 'ERROR: ' + detalle + '\n\n';
    });
  </script>

  <!-- Librería gráfica de base (no forma parte de "nuestro" código) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.4.2/pixi.min.js"></script>

  <!-- NÚCLEO DEL MOTOR: no sabe nada de tierra/pasto/cristal -->
  <script src="nucleo/bloques.js"></script>
  <script src="nucleo/motor.js"></script>
  <script src="nucleo/input.js"></script>
  <script src="nucleo/pantalla-seleccion.js"></script>

  <!-- CONFIGURACIÓN: acá es donde se define el juego en sí -->
  <script src="config-ejemplo.js"></script>

  <script>
    // Chequeo extra: si PIXI no llegó a cargar (por ejemplo, el CDN falló),
    // lo avisamos explícitamente en el panel de errores.
    if (typeof PIXI === 'undefined') {
      const panel = document.getElementById('panel-errores');
      panel.style.display = 'block';
      panel.textContent += 'ERROR: la librería PIXI no se cargó (revisar conexión al CDN).\n\n';
    }
  </script>

</body>
</html>
