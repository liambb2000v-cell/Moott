<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mi Motor - Editor</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #1a1a1a;
    overflow: hidden;
    font-family: sans-serif;
  }

  #editor {
    display: flex;
    height: 100vh;
  }

  /* --- Panel lateral de bloques --- */
  #panel-lateral {
    width: 64px;
    background: #222;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 8px;
    gap: 8px;
    flex-shrink: 0;
    z-index: 10;
  }

  .boton-bloque {
    width: 48px;
    height: 48px;
    border-radius: 8px;
    border: 2px solid transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 10px;
    text-align: center;
    cursor: pointer;
  }

  .boton-bloque.seleccionado {
    border-color: #fff;
  }

  /* --- Viewport (donde vive el motor) --- */
  #motor-contenedor {
    flex: 1;
    height: 100vh;
    position: relative;
  }

  /* Panel de diagnóstico (igual que en index.html, para depurar si hace falta) */
  #panel-diagnostico {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    max-height: 60vh;
    overflow-y: auto;
    background: #111;
    color: #9be7ff;
    font-family: monospace;
    font-size: 11px;
    padding: 8px;
    z-index: 9999;
    white-space: pre-wrap;
    display: none;
  }
  #panel-diagnostico .linea-error { color: #ffb3b3; }
</style>
</head>
<body>

  <div id="panel-diagnostico"></div>

  <div id="editor">
    <div id="panel-lateral">
      <!-- Los botones de bloque se arman por JS en editor.js, ya que
           dependen del registro de Bloques del núcleo -->
    </div>
    <div id="motor-contenedor"></div>
  </div>

  <script>
    function diagnostico(mensaje, esError) {
      const panel = document.getElementById('panel-diagnostico');
      const linea = document.createElement('div');
      if (esError) {
        linea.className = 'linea-error';
        panel.style.display = 'block';
      }
      linea.textContent = (esError ? 'ERROR: ' : 'OK: ') + mensaje;
      panel.appendChild(linea);
    }

    window.addEventListener('error', function (evento) {
      if (evento.error) {
        diagnostico(`${evento.message} (${evento.filename}:${evento.lineno})`, true);
      } else if (evento.target && evento.target.tagName === 'SCRIPT') {
        diagnostico(`No se pudo cargar el archivo: ${evento.target.src}`, true);
      }
    }, true);
  </script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.4.2/pixi.min.js"></script>
  <script src="nucleo/bloques.js"></script>
  <script src="nucleo/minibloques.js"></script>
  <script src="nucleo/motor.js"></script>

  <!-- Bloques base del editor: tierra, agua, jugador, enemigo, multifuncional -->
  <script src="nucleo/bloques-base.js"></script>

  <!-- El editor en sí: arma el panel lateral y la interacción de colocar bloques -->
  <script src="nucleo/editor.js"></script>

</body>
</html>
